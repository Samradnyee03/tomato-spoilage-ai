<!DOCTYPE html>
<html>
<head>
<title>Tomato Spoilage Dashboard</title>

<style>

body{
background:#0b0f1e;
color:white;
font-family:Arial;
text-align:center;
}

.panel{
width:350px;
margin:auto;
padding:25px;
background:#111827;
border-radius:10px;
box-shadow:0px 0px 20px #00fff7;
}

input{
width:80%;
padding:10px;
margin:10px;
border-radius:5px;
border:none;
}

button{
padding:10px 20px;
background:#00fff7;
border:none;
border-radius:5px;
font-size:16px;
cursor:pointer;
}

#result{
margin-top:20px;
font-size:22px;
color:#00ff88;
}

</style>
</head>

<body>

<h1>🍅 Tomato Spoilage AI Dashboard</h1>

<div class="panel">

<p>Temperature</p>
<input id="temp" value="28">

<p>Humidity</p>
<input id="humidity" value="75">

<p>VOC Gas</p>
<input id="gas" value="220">

<br><br>

<button onclick="predict()">Predict</button>

<h2 id="result">Waiting...</h2>

</div>

<script>

function predict(){

let temp=document.getElementById("temp").value
let humidity=document.getElementById("humidity").value
let gas=document.getElementById("gas").value

fetch("/predict",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
temp:parseFloat(temp),
humidity:parseFloat(humidity),
gas:parseFloat(gas)
})

})

.then(res=>res.json())

.then(data=>{
document.getElementById("result").innerText=data.status
})

}

</script>

</body>
</html>
