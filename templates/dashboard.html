<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tomato Spoilage AI Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Fraunces:wght@300;600;900&display=swap" rel="stylesheet">

<style>

body{
background:#070b17;
color:white;
font-family:'DM Mono',monospace;
display:flex;
flex-direction:column;
align-items:center;
padding:40px;
}

h1{
font-family:'Fraunces',serif;
font-size:38px;
margin-bottom:30px;
}

.container{
width:850px;
max-width:95%;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:20px;
margin-bottom:20px;
}

.card{
background:#111827;
border-radius:10px;
padding:25px;
box-shadow:0 0 20px rgba(0,255,255,0.08);
}

.label{
font-size:12px;
color:#9ca3af;
margin-bottom:8px;
}

.value{
font-family:'Fraunces',serif;
font-size:38px;
}

.unit{
font-size:14px;
color:#aaa;
}

.status-card{
grid-column:1/4;
text-align:center;
padding:30px;
}

.status-title{
font-family:'Fraunces',serif;
font-size:28px;
margin-bottom:10px;
}

.status-desc{
font-size:14px;
color:#ccc;
}

.bar{
margin-top:15px;
width:100%;
height:10px;
background:#1f2937;
border-radius:10px;
overflow:hidden;
}

.bar-fill{
height:100%;
background:linear-gradient(90deg,#22c55e,#facc15,#ef4444);
width:0%;
}

.footer{
margin-top:20px;
font-size:12px;
color:#888;
}

.live{
color:#22c55e;
font-weight:bold;
}

</style>

</head>

<body>

<h1>🍅 Tomato Spoilage AI Dashboard</h1>

<div class="container">

<div class="grid">

<!-- Temperature -->
<div class="card">

<div class="label">Temperature</div>

<div class="value">
<span id="temp">--</span>
<span class="unit">°C</span>
</div>

</div>

<!-- Humidity -->
<div class="card">

<div class="label">Humidity</div>

<div class="value">
<span id="humidity">--</span>
<span class="unit">%</span>
</div>

</div>

<!-- Gas -->
<div class="card">

<div class="label">VOC Gas</div>

<div class="value">
<span id="gas">--</span>
<span class="unit">ppm</span>
</div>

<div class="bar">
<div class="bar-fill" id="gasbar"></div>
</div>

</div>

<!-- Status -->
<div class="card status-card">

<div class="status-title" id="status">
Waiting for sensor data...
</div>

<div class="status-desc" id="remark">
ESP32 readings will appear here.
</div>

</div>

</div>

<div class="footer">

<span class="live">● LIVE</span>
<span id="time"></span>

</div>

</div>

<script>

async function fetchData(){

try{

const response = await fetch("/data");
const data = await response.json();

document.getElementById("temp").innerText = data.temp;
document.getElementById("humidity").innerText = data.humidity;
document.getElementById("gas").innerText = data.gas;

document.getElementById("status").innerText = data.status;
document.getElementById("remark").innerText = data.remark;

/* Color status */

if(data.status === "Fresh Tomato"){
document.getElementById("status").style.color="#22c55e";
}

else if(data.status === "Spoiling Tomato"){
document.getElementById("status").style.color="#facc15";
}

else{
document.getElementById("status").style.color="#ef4444";
}

/* Gas progress bar */

let gasPercent = data.gas / 4;
document.getElementById("gasbar").style.width = gasPercent + "%";

/* Timestamp */

const now = new Date();

document.getElementById("time").innerText =
"Last update: " + now.toLocaleTimeString();

}

catch(error){

console.log("Waiting for server...");

}

}

/* Update every 5 seconds */

setInterval(fetchData,5000);

fetchData();

</script>

</body>
</html>
